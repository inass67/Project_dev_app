# Paquet installable (TP6) et configuration des outils de qualité (TP4).

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-app"
version = "0.6.0"
description = "Classifieur de sentiment d'avis clients en français : modèle, API et interface"
readme = "README.md"
requires-python = ">=3.11"
# scikit-learn figé : le modèle sérialisé dépend de la version qui l'a produit
dependencies = [
    "scikit-learn==1.5.*",
    "joblib>=1.4",
    "fastapi==0.115.*",
    "uvicorn==0.30.*",
    "pydantic==2.9.*",
    "httpx==0.27.*",
]

[project.optional-dependencies]
ui = ["streamlit==1.39.*"]

[project.scripts]
sentiment = "sentiment_app.cli:main"

# Seuls les trois paquets de l'application entrent dans la roue : ni tests, ni données, ni modèle
[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "sentiment_app*", "ui*"]


[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E4, E7, E9, F : erreurs probables ; I : ordre des imports ; B : constructions à risque
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*", "pandas", "pandas.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.coverage.report]
show_missing = true
skip_empty = true
